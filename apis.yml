apis:
- aid: affinity-solutions:affinity-solutions-mcp-server
  name: Affinity Solutions MCP Server
  description: An OAuth-protected Model Context Protocol server that Affinity Solutions serves from its
    own corporate site at www.affinity.solutions, advertised by an RFC 8414 authorization-server
    document and an RFC 9728 protected-resource document. Two MCP endpoints are registered under the
    site's WordPress REST namespace; both return HTTP 401 to an anonymous tools/list, so the live tool
    set and input schemas require an authenticated OAuth introspection. This is a site/content MCP
    surface, not the Comet consumer purchase data product, which is licensed through clean rooms and
    Snowflake.
  image: https://www.affinity.solutions/wp-content/uploads/2026/06/header-logo.svg
  humanURL: https://www.affinity.solutions/
