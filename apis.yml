aid: affinity-solutions
name: Affinity Solutions
description: 'Affinity Solutions is a New York consumer purchase data and insights company that
  licenses bank-direct, permissioned credit and debit card transaction data covering 100M+ consumers
  and tens of billions of annual purchases. Its Comet platform turns that transaction feed into
  Consumer Purchase Insights, Consumer Purchase Lift, Consumer Purchase Audiences, Card-Linked
  Engagement and Consumer Bank Campaigns products for brands, media owners, retail and QSR, financial
  services and investors. Data is delivered through data clean rooms (AWS Clean Rooms), a Snowflake
  Native App on Snowflake Marketplace, managed services and aggregated-insight APIs rather than a
  public self-serve developer portal; no public API reference, OpenAPI description or SDK is published.
  The one machine-readable surface the company serves anonymously is an OAuth-protected Model Context
  Protocol server on its marketing site.'
